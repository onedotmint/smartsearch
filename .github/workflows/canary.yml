name: Provider Canary

# Advisory live-provider canary. Never part of the PR gate (test.yml) and
# never a required check: it exercises real upstream behavior (field drift,
# auth rules, HTTP changes) so provider breakage is visible before release and
# on a weekly cadence. A failing canary fails only this job and leaves JSON
# artifacts for inspection.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      SMART_SEARCH_CONFIG_DIR: ${{ runner.temp }}/smart-search-canary-config
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_URL: ${{ secrets.TAVILY_API_URL }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      EXA_BASE_URL: ${{ secrets.EXA_BASE_URL }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      JINA_READER_API_URL: ${{ secrets.JINA_READER_API_URL }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      ZHIPU_API_URL: ${{ secrets.ZHIPU_API_URL }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      FIRECRAWL_API_URL: ${{ secrets.FIRECRAWL_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm package
        run: npm ci

      # postinstall creates the isolated .smart-search-python runtime; the
      # canary must use its python, not the system interpreter.

      - name: Run live smoke
        continue-on-error: true
        run: |
          mkdir -p canary-results
          .smart-search-python/bin/python -m smart_search.cli dev smoke --live --format json \
            > canary-results/smoke.json 2>&1 || echo "{\"step\": \"smoke\", \"exit\": $?}" >> canary-results/smoke.json

      - name: Run doctor probe
        continue-on-error: true
        run: |
          .smart-search-python/bin/python -m smart_search.cli doctor probe --format json \
            > canary-results/doctor.json 2>&1 || echo "{\"step\": \"doctor\", \"exit\": $?}" >> canary-results/doctor.json

      - name: Probe exa
        continue-on-error: true
        run: |
          .smart-search-python/bin/python -m smart_search.cli provider probe exa --format json \
            > canary-results/provider-exa.json 2>&1 || echo "{\"step\": \"provider-exa\", \"exit\": $?}" >> canary-results/provider-exa.json

      - name: Probe tavily
        continue-on-error: true
        run: |
          .smart-search-python/bin/python -m smart_search.cli provider probe tavily --format json \
            > canary-results/provider-tavily.json 2>&1 || echo "{\"step\": \"provider-tavily\", \"exit\": $?}" >> canary-results/provider-tavily.json

      - name: Probe jina
        continue-on-error: true
        run: |
          .smart-search-python/bin/python -m smart_search.cli provider probe jina --format json \
            > canary-results/provider-jina.json 2>&1 || echo "{\"step\": \"provider-jina\", \"exit\": $?}" >> canary-results/provider-jina.json

      - name: Fail on any canary failure
        run: |
          set -e
          python3 scripts/canary-check.py canary-results/

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-results
          path: canary-results/
          if-no-files-found: ignore
